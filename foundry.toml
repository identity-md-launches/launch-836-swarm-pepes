[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
ffi = false
fs_permissions = []

[profile.default.fuzz]
runs = 256

[fmt]
ignore = ["lib/**"]
